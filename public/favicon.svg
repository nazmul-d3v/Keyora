<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="keyora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Key Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0f172a" stroke="url(#keyora-grad)" stroke-width="2.5" />
  <rect x="8" y="8" width="48" height="48" rx="10" fill="#1e293b" fill-opacity="0.6" />
  
  <!-- Stylized 'K' with Speed Slash -->
  <path d="M22 18 V46" stroke="url(#keyora-grad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M42 20 L27 32 L43 44" stroke="url(#keyora-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="43" cy="20" r="2.5" fill="#38bdf8" filter="url(#glow)" />
</svg>
