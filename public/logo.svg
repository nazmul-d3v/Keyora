<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Badge -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#0f172a" stroke="url(#logo-grad)" stroke-width="2" />
    <rect x="3" y="3" width="42" height="42" rx="9" fill="#1e293b" fill-opacity="0.7" />
    <path d="M16 14 V34" stroke="url(#logo-grad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M33 16 L20 25 L33 34" stroke="url(#logo-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="33" cy="16" r="2" fill="#38bdf8" filter="url(#logo-glow)" />
  </g>
  
  <!-- Logotype Text -->
  <text x="68" y="37" font-family="'JetBrains Mono', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    KEY<tspan fill="url(#logo-grad)">ORA</tspan>
  </text>
  <circle cx="218" cy="24" r="3" fill="#38bdf8" filter="url(#logo-glow)" />
</svg>
